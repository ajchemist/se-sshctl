name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release or retry
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate immutable release inputs
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f LICENSE
          git rev-parse --verify "refs/tags/$TAG^{commit}"
          # A binary that reports a version it was not built for is worse than
          # one that reports none, so the tag and the constant must agree.
          grep -q "seSSHCTLVersion = \"${TAG#v}\"" Sources/SSHCTLCore/Version.swift

      - name: Build and test
        run: |
          swift build --configuration release
          swift test

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
